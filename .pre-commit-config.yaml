repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-yaml
        exclude: ^docs/
      - id: check-toml
      - id: check-merge-conflict
        exclude: ^docs/
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: debug-statements
  - repo: https://github.com/hija/clean-dotenv
    rev: v0.0.7
    hooks:
      - id: clean-dotenv
        args: ["--root_path", "./examples"]
  - repo: https://github.com/srstevenson/nb-clean
    rev: 4.0.1
    hooks:
      - id: nb-clean
        args:
          - --remove-empty-cells
          - --preserve-notebook-metadata
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.2
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: commit-message
        name: commit message
        entry: uv run python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
        verbose: true
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
