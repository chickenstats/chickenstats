[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chickenstats"
version = "1.9.1"
description = "A Python package for scraping & analyzing sports statistics"
keywords = ["nhl", "hockey", "scraper", "statistics", "sports", "data", "analytics"]
authors = [{name = "chickenandstats", email = "chicken@chickenandstats.com"}]
maintainers = [{name = "chickenandstats", email = "chicken@chickenandstats.com"}]
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11.5"
dependencies = [
    "lxml>=5.3.0",
    "narwhals>=2.15.0,<3",
    "numpy>=2.1,<3",
    "pandera>=0.32.1,<1",
    "pillow>=10.0.0,<14",
    "polars>=1.38.1,<2",
    "pydantic>=2.9.0,<3",
    "requests>=2.32.3",
    "rich>=13.8.0",
    "typer>=0.16.0",
    "typing-extensions>=4.12.0",
    "unidecode>=1.3.8",
    "urllib3>=2.1.0",
    "chickenstats-api>=0.1.8,<0.2",
    "tzdata>=2024.1",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
chickenstats = "chickenstats.cli:main"

[project.urls]
Homepage = "https://chickenstats.com"
Repository = "https://github.com/chickenstats/chickenstats"
Documentation = "https://docs.chickenstats.com"
"Bug Tracker" = "https://github.com/chickenstats/chickenstats/issues"

[project.optional-dependencies]
plotting = [
  "bokeh>=3.6.3",
  "hockey-rink>=1.0.3",
  "matplotlib>=3.9.2",
  "networkx>=3.4.2",
  "pandas>=2.2.2,<4",
  "plotly>=6.0.0",
  "pyarrow>=22.0.0,<27",
  "seaborn>=0.13.2",
]
pandas = [
    "pandas>=2.2.2,<4",
    "pyarrow>=22.0.0,<27",
]
pyarrow = [
    "pyarrow>=22.0.0,<27",
]
rapm = [
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    { "include-group" = "tests"},
    { "include-group" = "package"},
    "deltalake>=0.25.0",
    "google-cloud-storage>=3.13.0",
    "requests-cache>=1.3.3",
]
package = [
    "ipython>=8.38.0",
    "jupyter>=1.1.1",
    "ruff>=0.17",
    "pre-commit>=4.0.1",
    "python-dotenv>=1.0.1",
    "clean-dotenv>=0.0.7",
    "ty>=0.0.11",
    "pyarrow-stubs>=20.0.0.20250928",
    "griffelib>=2.4.1",
]
docs = [
    # The docs import viz and rapm to document them, so the build needs their extras
    "chickenstats[plotting,rapm]",
    "zensical>=0.0.55",
    "mkdocstrings-python>=1.11.1",
    "black>=24.8.0",
    "mdformat-ruff>=0.1.3",
    "nb-clean>=4.0.1",
    "nbconvert>=7.16.4",
]
tests = [
    "pytest-cov>=5.0.0",
    "pytest>=8.3.2",
    "tox-gh>=1.3.3",
    "tox>=4.18.1",
    "coverage>=7.6.9",
    "pytest-xdist>=3.8.0",
    "pytest-rerunfailures>=15.0",
    "matplotlib>=3.9.2",
    "pandas>=2.2.2,<4",
    "pillow>=10.0.0,<14",
    "pyarrow>=22.0.0,<27",
    "scipy>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chickenstats"]

# An allow-list, so a local build cannot pick up scratch files or test data that may not be redistributed.
# Hatchling adds the readme, the license, pyproject.toml and .gitignore on its own.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/chickenstats",
    "CHANGELOG.md",
    "CITATION.cff",
]

[tool.ruff]
include = [
    "pyproject.toml",
    "src/chickenstats/**/*.py",
    "examples/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py"
    ]
extend-include = ["*.ipynb"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "D", "UP", "B", "PLW1514"]
fixable = ["ALL"]
ignore = ["D100", "B017", "B007", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104", "D205"]
"tests/**/*.py" = ["D"]
"!src/**/*.py" = ["F401"]
"examples/blog/monte_carlo/monte_carlo.py" = ["B023"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests",]
minversion = 7.0
filterwarnings = [
    "default",
]
markers = [
    "regression: fix-specific historical games; run explicitly with -m regression",
    "nhl: tests that download from the NHL; every other test runs from the saved responses with the network blocked",
    "live: integration tests that require a live chickenstats API endpoint and credentials",
    "pandas: test requires pandas installed",
    "pyarrow: test requires pyarrow installed",
    "matplotlib: test requires matplotlib installed",
    "pil: test requires pillow installed",
]
# Tests that need the NHL or the chickenstats API are left out unless asked for, e.g. pytest -m nhl
# Coverage is off by default; CI and tox turn it on
addopts = "-n auto --dist loadscope -m 'not nhl and not live'"

[tool.coverage.run]
source = ["chickenstats"]
relative_files = true
parallel = true
data_file = ".coverage"

[tool.coverage.paths]
source = [
    "src/chickenstats",
    ".tox/*/lib/python*/site-packages/chickenstats",
    ".tox/*/site-packages/chickenstats",
]

[tool.coverage.report]
fail_under = 90
exclude_also = [
    # Comments to turn coverage on and off:
    "no cover: start(?s:.)*?no cover: stop",
    ]

[tool.tox]
min_version = "4.0"
env_list = [
  "py311-lin", "py311-mac", "py311-win",
  "py312-lin", "py312-mac", "py312-win",
  "py313-lin", "py313-mac", "py313-win",
  "py314-lin", "py314-mac", "py314-win",
]

[tool.tox.env_run_base]
labels = ["ci"]
skip_install = false
pass_env = ["*"]
set_env = {COVERAGE_FILE = ".coverage.{env_name}"}
commands = [["pytest", "-m", "{env:PYTEST_MARKERS:not live}", "{posargs}", "--cov=src/chickenstats", "--cov-branch", "--cache-clear", "--reruns", "2", "--reruns-delay", "10"]]
package = "editable"
extras = ["plotting"]
dependency_groups = ["tests"]

[tool.tox.env.clean]
platform = ".*"
labels = ["local"]
description = "Erase previous coverage data"
deps = ["coverage"]
skip_install = true
commands = [["coverage", "erase"]]

[tool.tox.env.py313-local]
platform = ".*"
labels = ["local"]
description = "Run local test suite with coverage"
package = "editable"
depends = ["clean"]
extras = ["plotting"]
dependency_groups = ["tests"]
commands = [["pytest", "-m", "not regression and not live", "{posargs:tests}", "--cov=src/chickenstats", "--cov-branch", "--cov-append"]]

[tool.tox.env.report]
platform = ".*"
labels = ["local"]
description = "Generate final coverage report"
deps = ["coverage"]
skip_install = true
depends = ["py313-local"]
commands = [["coverage", "report"], ["coverage", "html"]]

[tool.git-cliff.changelog]
header = """
# Changelog

Changes that affect users of the package, newest release first. Generated from commit messages by git-cliff;
see CONTRIBUTING.md for the commit format.\n
"""
# One line per commit, plus a sub-bullet for a Breaking: paragraph
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
          {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
          {% for paragraph in commit.raw_message | split(pat="\n\n") %}\
              {% if paragraph is starting_with("Breaking:") %}
                  {{ "  - " }}{{ paragraph | trim_start_matches(pat="Breaking:") | replace(from="\n", to=" ") | trim }}\
              {% endif %}\
          {% endfor %}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Off so a skip rule can drop a breaking commit
protect_breaking_commits = false
# Only user-facing types reach the changelog
commit_parsers = [
  { message = "\\[skip ci\\]", skip = true },
  # Upgrade-page entries
  { message = "^docs: [^\\n]* (to|on) the (1\\.9 )?upgrade page\n", skip = true },
  { message = "^docs: list [^\\n]* for 1\\.9\n", skip = true },
  # Cache changes made obsolete by its removal
  { message = "^fix!: write the cache one game at a time, and refuse old caches\n", skip = true },
  { message = "^fix!: return only the requested games from a cache\n", skip = true },
  { message = "^feat: record the schema and chickenstats version in the cache\n", skip = true },
  { message = "^fix: remove only the files a cache lists when overwrite=True\n", skip = true },
  { message = "^fix: read games added with add_games\\(\\) from the cache\n", skip = true },
  { message = "^fix: keep each Scraper's games when several share a cache directory\n", skip = true },
  { message = "^fix: skip the prefetch when every report is already cached\n", skip = true },
  # Docs changes for contributors
  { message = "^docs: describe the nhl marker and the offline test run\n", skip = true },
  { message = "^docs: add _espn\\.py to the developer guide\n", skip = true },
  { message = "^docs\\(chicken_nhl\\): build Game and Scraper data docstrings from templates\n", skip = true },
  { message = "^docs\\(chicken_nhl\\): drop two resolved notes from api_events_fixes\n", skip = true },
  { message = "^docs\\(chicken_nhl\\): list three games whose report errors have no fix\n", skip = true },
  { message = "^docs: drop the empty line-number links from code blocks\n", skip = true },
  { message = "^docs: serve the docs fonts from the docs site\n", skip = true },
  { message = "^docs: restore the page table of contents, stop serving the template\n", skip = true },
  { message = "^docs: drop the dead Twitter link from the acknowledgements\n", skip = true },
  { message = "^docs: link CONTRIBUTING and the Code of Conduct absolutely in README\n", skip = true },
  { message = "^docs: remove 14 unused guide table CSVs from the docs site\n", skip = true },
  { message = "^docs: remove the inert social-card settings and their background image\n", skip = true },
  { message = "^docs: hide private members on the exceptions reference page\n", skip = true },
  { message = "^docs: mark the newly nullable columns on the schema pages\n", skip = true },
  { message = "^[a-z]+(\\(.+\\))?!:|BREAKING CHANGE", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(refactor|test|build|ci|style|chore)", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
