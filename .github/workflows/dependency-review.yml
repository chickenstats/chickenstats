name: dependency-review

on:
  pull_request:
    branches: [main, 'v*']

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: moderate
