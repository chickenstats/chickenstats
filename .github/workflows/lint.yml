name: Lint

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    # The push already linted a branch from this repo, so a pull request lints only from a fork,
    # or from the changelog branch, whose push by the release app starts no run
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.fork
      || startsWith(github.head_ref, 'changelog/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install the project
        run: uv sync --dev --all-extras

      - name: ruff check
        run: uv run ruff check --no-fix --output-format=github src/ tests/ scripts/

      - name: ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: ty check
        run: uv run ty check src/ tests/ scripts/ examples/

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check the commit messages
        run: >
          python3 scripts/check_commit_message.py
          --range origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
