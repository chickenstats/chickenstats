name: Lint

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install the project
        run: uv sync --dev --all-extras

      - name: ruff check
        run: uv run ruff check --no-fix --output-format=github src/ tests/ scripts/

      - name: ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: ty check
        run: uv run ty check src/ tests/ scripts/

      - name: commit messages
        if: github.event_name == 'pull_request'
        run: >
          uv run python scripts/check_commit_message.py
          --range origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
