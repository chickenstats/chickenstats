name: sync version

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version across pyproject.toml, CITATION.cff, README.md, docs/index.md
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          echo "Branch: $BRANCH"

          PACKAGE_VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Package version: $PACKAGE_VERSION"

          # Version branches (e.g. v1.8.0, or v1.7.9.27/fix-foo) drive pyproject.toml first.
          if [[ "$BRANCH" =~ ^v[0-9] ]]; then
            VERSION_PREFIX="${BRANCH%%/*}"
            BRANCH_VERSION="${VERSION_PREFIX#v}"
            echo "Branch version: $BRANCH_VERSION"

            if [[ "$BRANCH_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Updating pyproject.toml: $PACKAGE_VERSION → $BRANCH_VERSION"
              sed -i "s/^version = \".*\"/version = \"$BRANCH_VERSION\"/" pyproject.toml
              PACKAGE_VERSION="$BRANCH_VERSION"
            fi
          fi

          # Propagate PACKAGE_VERSION to every file that hardcodes it.
          sed -i "s/^version: .*/version: $PACKAGE_VERSION/" CITATION.cff
          sed -i "s/latest version (.*)/latest version ($PACKAGE_VERSION)/" README.md
          sed -i "s/latest version (.*)/latest version ($PACKAGE_VERSION)/" docs/index.md
          sed -i "s/_VERSION = \".*\"/_VERSION = \"$PACKAGE_VERSION\"/" src/chickenstats/chicken_nhl/validation_pydantic.py

          if git diff --quiet; then
            echo "Nothing to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CITATION.cff README.md docs/index.md src/chickenstats/chicken_nhl/validation_pydantic.py
          git commit -m "chore: sync version to $PACKAGE_VERSION [skip ci]"
          git push
