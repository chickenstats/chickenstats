name: sync version

on:
  create:

permissions:
  contents: write

jobs:
  sync-version:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync version across pyproject.toml, CITATION.cff, README.md, docs/index.md, uv.lock
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          echo "Branch: $BRANCH"

          # BSD sed needs an argument after -i; GNU sed rejects one
          if sed --version >/dev/null 2>&1; then
            sedi() { sed -i "$@"; }
          else
            sedi() { sed -i '' "$@"; }
          fi

          PACKAGE_VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "Package version: $PACKAGE_VERSION"

          # Version branches (e.g. v1.8.0, or v1.7.9.27/fix-foo) drive pyproject.toml first.
          PYPROJECT_CHANGED=0
          if [[ "$BRANCH" =~ ^v[0-9] ]]; then
            VERSION_PREFIX="${BRANCH%%/*}"
            BRANCH_VERSION="${VERSION_PREFIX#v}"
            echo "Branch version: $BRANCH_VERSION"

            if [[ "$BRANCH_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "Updating pyproject.toml: $PACKAGE_VERSION → $BRANCH_VERSION"
              sedi "s/^version = \".*\"/version = \"$BRANCH_VERSION\"/" pyproject.toml
              PACKAGE_VERSION="$BRANCH_VERSION"
              PYPROJECT_CHANGED=1
            fi
          fi

          # Propagate PACKAGE_VERSION to every file that hardcodes it.
          sedi "s/^version: .*/version: $PACKAGE_VERSION/" CITATION.cff
          sedi "s/latest version (.*)/latest version ($PACKAGE_VERSION)/" README.md
          sedi "s/latest version (.*)/latest version ($PACKAGE_VERSION)/" docs/index.md

          # Relock only when the version changed
          if [[ "$PYPROJECT_CHANGED" == "1" ]]; then
            uv lock
          fi

          if git diff --quiet; then
            echo "Nothing to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CITATION.cff README.md docs/index.md uv.lock
          git commit -m "chore: sync version to $PACKAGE_VERSION [skip ci]"
          git push
