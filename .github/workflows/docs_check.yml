name: docs-check

# Builds the docs strictly without deploying
on:
  push:
    branches:
      - 'v*'
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'src/**'
      - 'zensical.toml'
      - 'scripts/griffe_public_bases.py'
      - 'scripts/griffe_attribute_docstrings.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs_check.yml'
  pull_request:
    branches: [main, 'v*']
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'src/**'
      - 'zensical.toml'
      - 'scripts/griffe_public_bases.py'
      - 'scripts/griffe_attribute_docstrings.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs_check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --dev --group docs

      - name: Build documentation
        run: uv run zensical build --strict --clean
