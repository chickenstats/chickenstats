name: docs-check

# Builds the docs strictly on any change that could break them, without deploying; new-release still deploys through docs.yml
on:
  push:
    branches:
      - 'v*'
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'src/**'
      - 'zensical.toml'
      - 'scripts/griffe_public_bases.py'
      - 'scripts/griffe_attribute_docstrings.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs_check.yml'
  pull_request:
    branches: [main, 'v*']
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'src/**'
      - 'zensical.toml'
      - 'scripts/griffe_public_bases.py'
      - 'scripts/griffe_attribute_docstrings.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs_check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The same checkout and install as docs.yml, so a clean build here is a clean deploy there
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --dev --group docs

      - name: Build documentation
        run: uv run zensical build --strict --clean
