name: battery

# Scrapes the release validation set and records time and memory. Run on request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battery:
    name: battery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A stalled NHL response would otherwise hold the runner for six hours
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --frozen --all-extras

      - name: Run the battery under GNU time
        if: runner.os == 'Linux'
        run: |
          [ -x /usr/bin/time ] || sudo apt-get install --yes time
          mkdir -p battery
          /usr/bin/time -v -o battery/gnu-time.txt .venv/bin/python scripts/benchmark_battery.py battery

      - name: Run the battery
        if: runner.os == 'Windows'
        run: uv run --frozen --no-sync python scripts/benchmark_battery.py battery

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-${{ runner.os }}
          path: battery/
          if-no-files-found: warn
