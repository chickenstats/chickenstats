name: regression

# The battery over historical games downloads from the NHL, so it runs on request, not on every change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --frozen --all-extras

      - name: Run the regression battery
        run: >
          uv run --frozen pytest -m regression --no-cov -n auto --dist loadscope
          --reruns 2 --reruns-delay 10 --junitxml=regression.xml

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: regression.xml
