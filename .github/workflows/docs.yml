name: docs

# new-release starts this on main once the package is on PyPI, so the site never describes a release that failed
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure pages
        uses: actions/configure-pages@v6.0.0

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install the project
        run: uv sync --dev --group docs

      - name: Build documentation
        run: uv run zensical build --strict --clean

      - name: Upload site as artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
