name: new-release

# A published GitHub release ships to PyPI. A manual run from a version branch is the dry run: it does
# everything up to the upload, sends to TestPyPI only if asked, and keeps the notes as an artifact.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_index:
        description: Upload to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse a GitHub prerelease
        if: github.event_name == 'release' && github.event.release.prerelease
        run: |
          echo "::error::A prerelease would publish to PyPI, so publish a full release instead"
          exit 1

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check the tag or branch against the package version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "${GITHUB_REF_NAME%%/*}" != "v$VERSION" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match version $VERSION in pyproject.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        run: uv build

      - name: Check what they contain
        run: python3 scripts/check_dist.py dist/*.tar.gz dist/*.whl

      - name: Keep them for the other jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-wheel:
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The checkout supplies the tests; removing src/ means they can only import the wheel
      - name: Install the wheel with the locked test dependencies
        run: |
          uv export --frozen --no-emit-project --no-hashes --no-default-groups --group tests --all-extras \
            --output-file requirements.txt
          rm -rf src
          uv venv --python ${{ matrix.python }}
          uv pip install --requirement requirements.txt
          uv pip install --no-deps dist/*.whl

      - name: Run the offline tests against the wheel
        run: .venv/bin/python -m pytest

      - name: Install the wheel alone and run it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv venv --python ${{ matrix.python }} .venv-core
          uv pip install --python .venv-core dist/*.whl
          test "$(.venv-core/bin/python -c 'import chickenstats; print(chickenstats.__version__)')" = "$VERSION"
          .venv-core/bin/chickenstats --help

  tests:
    needs: [build]
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
      actions: write
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # PyPI does not accept trusted publishing from a reusable workflow, so this job has to stay in this file
  publish:
    needs: [build, test-wheel, tests]
    if: github.event_name == 'release' || inputs.test_index
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/chickenstats' || 'https://test.pypi.org/p/chickenstats' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish the tested files
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # A version can only be uploaded once, so a repeat dry run must not fail on it
          skip-existing: ${{ github.event_name != 'release' }}

  # publish is skipped on a dry run without the test index, which should not stop the notes
  release-notes:
    needs: [build, publish]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: pyproject.toml
          args: >-
            ${{ github.event_name == 'release' && '--latest' || format('--unreleased --tag v{0}', needs.build.outputs.version) }}
            --strip header
        env:
          OUTPUT: release_notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Keep the dry-run notes
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

      - name: Update release body
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file release_notes.md

      - name: Add the release to CHANGELOG.md
        if: github.event_name == 'release'
        run: |
          # Prepend only this release's notes
          python3 - <<'EOF'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text()
          notes = Path("release_notes.md").read_text().strip()
          head, sep, rest = text.partition("\n## [")
          path.write_text(f"{head.rstrip()}\n\n{notes}\n\n## [{rest}" if sep else f"{text.rstrip()}\n\n{notes}\n")
          EOF

      - name: Open a pull request with the changelog
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$(cat CHANGELOG.md)" > CHANGELOG.md
          sed -i "s/^date-released: .*/date-released: $(date -u +%F)/" CITATION.cff
          git diff --quiet -- CHANGELOG.md CITATION.cff && exit 0
          BRANCH="changelog/${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add CHANGELOG.md CITATION.cff
          git commit -m "chore: update changelog for ${{ github.ref_name }} [skip ci]"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: update changelog for ${{ github.ref_name }}" \
            --body "Regenerated by git-cliff from the commits in this release, with the release date in CITATION.cff."

  docs:
    needs: [publish]
    if: github.event_name == 'release'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
